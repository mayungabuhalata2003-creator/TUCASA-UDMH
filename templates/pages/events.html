{% extends "base.html" %}
{% block title %}Matukio na Picha - TUMH{% endblock %}
{% block content %}
<h3 class="page-heading">Matukio na Picha</h3>
<p class="page-subtext">Matukio yajayo na kumbukumbu za shughuli za TUMH.</p>

<div class="row g-3">
    {% for event in events %}
    <div class="col-md-4">
        <div class="card-tucasa p-3 h-100">
            <div class="d-flex align-items-center justify-content-center mb-3" style="height:140px;background:linear-gradient(135deg,#0b1f3a,#1e4fa3);border-radius:10px;">
                <i class="bi bi-camera text-white" style="font-size:2rem;opacity:.6;"></i>
            </div>
            <h6 class="fw-bold">{{ event.jina }}</h6>
            <p class="text-muted small mb-1"><i class="bi bi-calendar3"></i> {{ event.tarehe }}</p>
            <p class="small mb-0">{{ event.maelezo }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
